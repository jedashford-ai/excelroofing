[build]
command = "npm run build"
publish = "dist"
[build.environment]
NODE_VERSION = "22"
[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
[[headers]]
for = "/images/*"
[headers.values]
Cache-Control = "public, max-age=86400"

[[redirects]]
from = "/thank-you"
to = "/#contact"
status = 301

[[redirects]]
from = "/contact-roofing-staffordshire.php"
to = "/#contact"
status = 301
